<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" width="1060" height="600" font-family="'Microsoft YaHei','SimHei',Arial,sans-serif">
<rect width="1060" height="600" fill="#ffffff"/>
<text x="530" y="44" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">四个领域的“变化尺度”与“适应尺度”错位</text><text x="530" y="68" font-size="13.5" fill="#666" text-anchor="middle">医疗、气候、心理、教育看似无关，却共享同一结构：应对所需时间远长于变化发生时间</text><line x1="283.6" y1="96" x2="283.6" y2="510" stroke="#ececec"/><text x="283.6" y="530" font-size="12" fill="#999" text-anchor="middle">1 天</text><line x1="507.1" y1="96" x2="507.1" y2="510" stroke="#ececec"/><text x="507.1" y="530" font-size="12" fill="#999" text-anchor="middle">1 月</text><line x1="671.3" y1="96" x2="671.3" y2="510" stroke="#ececec"/><text x="671.3" y="530" font-size="12" fill="#999" text-anchor="middle">1 年</text><line x1="822.7" y1="96" x2="822.7" y2="510" stroke="#ececec"/><text x="822.7" y="530" font-size="12" fill="#999" text-anchor="middle">10 年</text><line x1="974.0" y1="96" x2="974.0" y2="510" stroke="#ececec"/><text x="974.0" y="530" font-size="12" fill="#999" text-anchor="middle">100 年</text><line x1="250" y1="510" x2="980" y2="510" stroke="#333" stroke-width="1.2"/><text x="234" y="144" font-size="15" font-weight="700" fill="#222" text-anchor="end">传染病</text><rect x="250.0" y="120" width="105.8" height="24" rx="4" fill="#c94f4f" opacity="0.85"/><text x="365.8" y="137" font-size="12" fill="#c94f4f">疫情倍增（3 天）</text><rect x="250.0" y="150" width="257.1" height="24" rx="4" fill="#3a6ea5" opacity="0.85"/><text x="517.1" y="167" font-size="12" fill="#3a6ea5">床位与物资扩充（约 30 天）</text><line x1="355.8" y1="144" x2="507.1" y2="150" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/><text x="234" y="236" font-size="15" font-weight="700" fill="#222" text-anchor="end">气候</text><rect x="250.0" y="212" width="512.4" height="24" rx="4" fill="#c94f4f" opacity="0.85"/><text x="772.4" y="229" font-size="12" fill="#c94f4f">政治激励周期（4 年）</text><rect x="250.0" y="242" width="678.4" height="24" rx="4" fill="#3a6ea5" opacity="0.85"/><text x="918.4" y="259" font-size="12" fill="#ffffff" text-anchor="end">政策效果显现（约 50 年）</text><line x1="762.4" y1="236" x2="928.4" y2="242" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/><text x="234" y="328" font-size="15" font-weight="700" fill="#222" text-anchor="end">精神健康</text><rect x="250.0" y="304" width="33.6" height="24" rx="4" fill="#c94f4f" opacity="0.85"/><text x="293.6" y="321" font-size="12" fill="#c94f4f">社交媒体再创伤（约 1 天）</text><rect x="250.0" y="334" width="374.9" height="24" rx="4" fill="#3a6ea5" opacity="0.85"/><text x="634.9" y="351" font-size="12" fill="#3a6ea5">治疗显著见效（约 6 个月）</text><line x1="283.6" y1="328" x2="624.9" y2="334" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/><text x="234" y="420" font-size="15" font-weight="700" fill="#222" text-anchor="end">教育</text><rect x="250.0" y="396" width="466.9" height="24" rx="4" fill="#c94f4f" opacity="0.85"/><text x="726.9" y="413" font-size="12" fill="#c94f4f">技术知识陈旧（约 2 年）</text><rect x="250.0" y="426" width="512.4" height="24" rx="4" fill="#3a6ea5" opacity="0.85"/><text x="772.4" y="443" font-size="12" fill="#3a6ea5">学位取得（约 4 年）</text><line x1="716.9" y1="420" x2="762.4" y2="426" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/><text x="250" y="566" font-size="12" fill="#999">注：横轴为对数尺度（天）。四者的共同点是“适应尺度”远长于“变化尺度”；这不是管理能力不足，而是时间结构的错配。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" width="1060" height="540" font-family="'Microsoft YaHei','SimHei',Arial,sans-serif">
<rect width="1060" height="540" fill="#ffffff"/>
<text x="530" y="44" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">可控性 C = T_policy / T_threat</text><text x="530" y="68" font-size="13.5" fill="#666" text-anchor="middle">当政策执行时间超过威胁进展时间，C &lt; 1，系统进入“结构性不可控”区间</text><line x1="130.0" y1="120" x2="130.0" y2="430" stroke="#eee"/><text x="130.0" y="450" font-size="12" fill="#999" text-anchor="middle">0.05</text><line x1="254.5" y1="120" x2="254.5" y2="430" stroke="#eee"/><text x="254.5" y="450" font-size="12" fill="#999" text-anchor="middle">0.1</text><line x1="543.6" y1="120" x2="543.6" y2="430" stroke="#eee"/><text x="543.6" y="450" font-size="12" fill="#999" text-anchor="middle">0.5</text><line x1="668.1" y1="120" x2="668.1" y2="430" stroke="#eee"/><text x="668.1" y="450" font-size="12" fill="#999" text-anchor="middle">1 临界</text><line x1="865.5" y1="120" x2="865.5" y2="430" stroke="#eee"/><text x="865.5" y="450" font-size="12" fill="#999" text-anchor="middle">3</text><line x1="990.0" y1="120" x2="990.0" y2="430" stroke="#eee"/><text x="990.0" y="450" font-size="12" fill="#999" text-anchor="middle">6</text><rect x="130" y="120" width="538.1" height="310" fill="#c94f4f" opacity="0.07"/><line x1="668.1" y1="120" x2="668.1" y2="430" stroke="#c94f4f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="396.1" y="144" font-size="13" fill="#c94f4f" text-anchor="middle">不可控区（C &lt; 1）</text><text x="825.4" y="144" font-size="13" fill="#009E73" text-anchor="middle">可控区（C &gt; 1）</text><line x1="130" y1="430" x2="990" y2="430" stroke="#333" stroke-width="1.2"/><circle cx="543.6" cy="200" r="11" fill="#3a6ea5"/><circle cx="543.6" cy="200" r="18" fill="none" stroke="#3a6ea5" opacity="0.4"/><text x="543.6" y="174" font-size="14.5" font-weight="700" fill="#222" text-anchor="middle">台湾芯片</text><text x="543.6" y="240" font-size="12" fill="#666" text-anchor="middle">C = 0.5</text><text x="543.6" y="257" font-size="11.5" fill="#999" text-anchor="middle">T_policy 30 天 / T_threat 60 天</text><circle cx="315.0" cy="282" r="11" fill="#b8862f"/><circle cx="315.0" cy="282" r="18" fill="none" stroke="#b8862f" opacity="0.4"/><text x="315.0" y="256" font-size="14.5" font-weight="700" fill="#222" text-anchor="middle">东南亚债务</text><text x="315.0" y="322" font-size="12" fill="#666" text-anchor="middle">C = 0.14</text><text x="315.0" y="339" font-size="11.5" fill="#999" text-anchor="middle">T_policy 7 天 / T_threat 50 小时</text><circle cx="89.9" cy="364" r="11" fill="#c94f4f"/><circle cx="89.9" cy="364" r="18" fill="none" stroke="#c94f4f" opacity="0.4"/><text x="89.9" y="338" font-size="14.5" font-weight="700" fill="#222" text-anchor="middle">全球债务</text><text x="89.9" y="404" font-size="12" fill="#666" text-anchor="middle">C = 0.04</text><text x="89.9" y="421" font-size="11.5" fill="#999" text-anchor="middle">T_policy 30 天 / T_threat 24 小时</text><text x="130" y="516" font-size="12" fill="#999">注：C 为量级示意（质量 C）。它的价值不在精确值，而在提示“哪一类系统天然不可控”。</text></svg>

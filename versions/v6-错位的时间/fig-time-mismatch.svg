<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520" font-family="'Microsoft YaHei','SimHei',Arial,sans-serif">
<rect width="1060" height="520" fill="#ffffff"/>
<text x="530" y="44" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">市场时间与政治时间的错位</text><text x="530" y="68" font-size="13.5" fill="#666" text-anchor="middle">评级、定价与流动性枯竭发生在数小时内；可用的政治协调却在数日到数周之后</text><rect x="250.0" y="96" width="424.0" height="368" fill="#009E73" opacity="0.10"/><text x="545.2" y="112" font-size="12.5" fill="#009E73">黄金窗口（24—48 小时）</text><line x1="314.4" y1="96" x2="314.4" y2="470" stroke="#ececec"/><text x="314.4" y="490" font-size="12" fill="#999" text-anchor="middle">1 h</text><line x1="480.8" y1="96" x2="480.8" y2="470" stroke="#ececec"/><text x="480.8" y="490" font-size="12" fill="#999" text-anchor="middle">6 h</text><line x1="609.6" y1="96" x2="609.6" y2="470" stroke="#ececec"/><text x="609.6" y="490" font-size="12" fill="#999" text-anchor="middle">1 d</text><line x1="790.4" y1="96" x2="790.4" y2="470" stroke="#ececec"/><text x="790.4" y="490" font-size="12" fill="#999" text-anchor="middle">1 w</text><line x1="925.6" y1="96" x2="925.6" y2="470" stroke="#ececec"/><text x="925.6" y="490" font-size="12" fill="#999" text-anchor="middle">1 m</text><line x1="250" y1="470" x2="990" y2="470" stroke="#333" stroke-width="1.2"/><text x="236" y="138" font-size="13.5" fill="#333" text-anchor="end">评级下调</text><rect x="250.0" y="120" width="64.4" height="26" rx="5" fill="#c94f4f" opacity="0.82"/><text x="324.4" y="138" font-size="12" fill="#777">S&amp;P 单一决策</text><text x="236" y="204" font-size="13.5" fill="#333" text-anchor="end">市场定价完成</text><rect x="378.8" y="186" width="102.1" height="26" rx="5" fill="#d97a3d" opacity="0.82"/><text x="490.8" y="204" font-size="12" fill="#777">利差跳升、赎回潮</text><text x="236" y="270" font-size="13.5" fill="#333" text-anchor="end">央行初步反应</text><rect x="545.2" y="252" width="64.4" height="26" rx="5" fill="#b8862f" opacity="0.82"/><text x="619.6" y="270" font-size="12" fill="#777">口头干预／互换询价</text><text x="236" y="336" font-size="13.5" fill="#333" text-anchor="end">IMF 审议程序</text><rect x="738.4" y="318" width="52.0" height="26" rx="5" fill="#009E73" opacity="0.82"/><text x="800.4" y="336" font-size="12" fill="#777">执行董事会批准</text><text x="236" y="402" font-size="13.5" fill="#333" text-anchor="end">议会立法（财政规则暂停）</text><rect x="919.2" y="384" width="108.5" height="26" rx="5" fill="#6a4c93" opacity="0.82"/><text x="1037.7" y="402" font-size="12" fill="#777">民主程序不可压缩</text><text x="250" y="508" font-size="12" fill="#999">注：错位区间（约 24—168 小时）内，市场按最坏情况定价，而政治协调尚未完成——这正是“事后补救”取代“事前预防”的机制。</text></svg>

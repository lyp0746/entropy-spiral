<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500" y="42" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">三层思维网络</text><text x="500" y="66" font-size="14" fill="#666" text-anchor="middle">底层地缘—人口 · 中层制度—信息 · 上层政治实体；实线为约束，虚线为反馈</text><rect x="70" y="96" width="860" height="120" rx="14" fill="#eef3fb" stroke="#3a6ea5" stroke-width="1.5" opacity="0.95"/><circle cx="104" cy="156" r="12" fill="#3a6ea5" opacity="0.85"/><text x="130" y="148" font-size="20" font-weight="700" fill="#3a6ea5">上层 · 政治实体与两种主义</text><text x="130" y="178" font-size="15" fill="#445">吸取—重置循环 · 压力 ψ = αG</text><circle cx="620" cy="156" r="5" fill="#3a6ea5" opacity="0.5"/><circle cx="678" cy="156" r="5" fill="#3a6ea5" opacity="0.5"/><circle cx="736" cy="156" r="5" fill="#3a6ea5" opacity="0.5"/><circle cx="794" cy="156" r="5" fill="#3a6ea5" opacity="0.5"/><circle cx="852" cy="156" r="5" fill="#3a6ea5" opacity="0.5"/><rect x="70" y="258" width="860" height="120" rx="14" fill="#f3f9f5" stroke="#24502b" stroke-width="1.5" opacity="0.95"/><circle cx="104" cy="318" r="12" fill="#24502b" opacity="0.85"/><text x="130" y="310" font-size="20" font-weight="700" fill="#24502b">中层 · 制度、文化与信息</text><text x="130" y="340" font-size="15" fill="#445">评价权 Φ · 选拔质量 q = q₀(1−Φ) · 技术棘轮</text><circle cx="620" cy="318" r="5" fill="#24502b" opacity="0.5"/><circle cx="678" cy="318" r="5" fill="#24502b" opacity="0.5"/><circle cx="736" cy="318" r="5" fill="#24502b" opacity="0.5"/><circle cx="794" cy="318" r="5" fill="#24502b" opacity="0.5"/><circle cx="852" cy="318" r="5" fill="#24502b" opacity="0.5"/><rect x="70" y="420" width="860" height="120" rx="14" fill="#fbf4ee" stroke="#6b3d12" stroke-width="1.5" opacity="0.95"/><circle cx="104" cy="480" r="12" fill="#6b3d12" opacity="0.85"/><text x="130" y="472" font-size="20" font-weight="700" fill="#6b3d12">底层 · 地缘与人口分布</text><text x="130" y="502" font-size="15" fill="#445">地缘 Γ · 人口 n(x,t) · 承载力 K</text><circle cx="620" cy="480" r="5" fill="#6b3d12" opacity="0.5"/><circle cx="678" cy="480" r="5" fill="#6b3d12" opacity="0.5"/><circle cx="736" cy="480" r="5" fill="#6b3d12" opacity="0.5"/><circle cx="794" cy="480" r="5" fill="#6b3d12" opacity="0.5"/><circle cx="852" cy="480" r="5" fill="#6b3d12" opacity="0.5"/><line x1="430" y1="420" x2="430" y2="378" stroke="#333" stroke-width="2.4" marker-end="url(#lm1)"/><line x1="430" y1="258" x2="430" y2="216" stroke="#333" stroke-width="2.4" marker-end="url(#lm1)"/><text x="444" y="402" font-size="14" fill="#333">约束</text><text x="444" y="240" font-size="14" fill="#333">约束</text><line x1="680" y1="216" x2="680" y2="258" stroke="#b8862f" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#lm2)"/><line x1="680" y1="378" x2="680" y2="420" stroke="#b8862f" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#lm2)"/><text x="694" y="242" font-size="14" fill="#8a6520">重置改写底层</text><defs><marker id="lm1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#333"/></marker><marker id="lm2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b8862f"/></marker></defs><rect x="70" y="556" width="860" height="52" rx="10" fill="#fff8e8" stroke="#e0c58a"/><text x="90" y="588" font-size="15.5" fill="#6b3d12">关键设定：重置清除的是状态（α、G、ψ），不是边界（s、I、Φ）；因此同一个漩涡得以反复出现。</text></svg>

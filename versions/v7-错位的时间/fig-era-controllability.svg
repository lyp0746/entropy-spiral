<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520" font-family="'Microsoft YaHei','SimHei',Arial,sans-serif">
<rect width="1060" height="520" fill="#ffffff"/>
<text x="530" y="44" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">十九至二十一世纪：威胁周期与应对时间的交叉</text><text x="530" y="68" font-size="13.5" fill="#666" text-anchor="middle">威胁周期不断缩短（实线下降），应对时间却因协调阶数增加而延长（虚线上升），约在二十世纪末交叉</text><line x1="110" y1="350.0" x2="980" y2="350.0" stroke="#eee"/><line x1="110" y1="270.0" x2="980" y2="270.0" stroke="#eee"/><line x1="110" y1="190.0" x2="980" y2="190.0" stroke="#eee"/><rect x="110" y="110" width="547.0" height="320" fill="#009E73" opacity="0.05"/><rect x="657.0" y="110" width="323.0" height="320" fill="#c94f4f" opacity="0.06"/><line x1="657.0" y1="110" x2="657.0" y2="430" stroke="#c94f4f" stroke-width="1.5" stroke-dasharray="6 4"/><text x="649.0" y="132" font-size="12.5" fill="#009E73" text-anchor="end">可控</text><text x="665.0" y="132" font-size="12.5" fill="#c94f4f">不可控</text><path d="M130.0,231.6 L413.3,276.4 L696.7,334.0 L980.0,385.2" fill="none" stroke="#c94f4f" stroke-width="3" marker-end=""/><path d="M130.0,359.6 L413.3,321.2 L696.7,270.0 L980.0,199.6" fill="none" stroke="#3a6ea5" stroke-width="3"/><circle cx="130.0" cy="231.6" r="6" fill="#c94f4f"/><circle cx="130.0" cy="359.6" r="6" fill="#3a6ea5"/><circle cx="413.3" cy="276.4" r="6" fill="#c94f4f"/><circle cx="413.3" cy="321.2" r="6" fill="#3a6ea5"/><circle cx="696.7" cy="334.0" r="6" fill="#c94f4f"/><circle cx="696.7" cy="270.0" r="6" fill="#3a6ea5"/><circle cx="980.0" cy="385.2" r="6" fill="#c94f4f"/><circle cx="980.0" cy="199.6" r="6" fill="#3a6ea5"/><text x="140.0" y="217.6" font-size="13" fill="#c94f4f">威胁周期</text><text x="974.0" y="185.6" font-size="13" fill="#3a6ea5" text-anchor="end">应对时间</text><text x="130.0" y="454" font-size="12.5" fill="#555" text-anchor="middle">19 世纪</text><text x="413.3" y="454" font-size="12.5" fill="#555" text-anchor="middle">20 世纪中期</text><text x="696.7" y="454" font-size="12.5" fill="#555" text-anchor="middle">20 世纪末</text><text x="980.0" y="454" font-size="12.5" fill="#555" text-anchor="middle">21 世纪</text><text x="110" y="496" font-size="12" fill="#999">注：纵轴为“相对时间尺度”示意（质量 C）；交叉点的含义是“应对能力的增长慢于威胁节奏的加快”。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" font-family="'Microsoft YaHei','SimHei',Arial,sans-serif">
<rect width="1060" height="560" fill="#ffffff"/>
<text x="530" y="44" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">社会子系统的运行时间层级</text><text x="530" y="68" font-size="13.5" fill="#666" text-anchor="middle">横轴为对数尺度：从小时到数十年，各子系统的“最小决策／反馈时间”相差六个数量级</text><line x1="260.4" y1="96" x2="260.4" y2="470" stroke="#ececec"/><text x="260.4" y="490" font-size="12" fill="#999" text-anchor="middle">6 min</text><line x1="368.1" y1="96" x2="368.1" y2="470" stroke="#ececec"/><text x="368.1" y="490" font-size="12" fill="#999" text-anchor="middle">1 h</text><line x1="516.6" y1="96" x2="516.6" y2="470" stroke="#ececec"/><text x="516.6" y="490" font-size="12" fill="#999" text-anchor="middle">1 d</text><line x1="607.6" y1="96" x2="607.6" y2="470" stroke="#ececec"/><text x="607.6" y="490" font-size="12" fill="#999" text-anchor="middle">1 w</text><line x1="675.6" y1="96" x2="675.6" y2="470" stroke="#ececec"/><text x="675.6" y="490" font-size="12" fill="#999" text-anchor="middle">1 m</text><line x1="792.4" y1="96" x2="792.4" y2="470" stroke="#ececec"/><text x="792.4" y="490" font-size="12" fill="#999" text-anchor="middle">1 y</text><line x1="900.1" y1="96" x2="900.1" y2="470" stroke="#ececec"/><text x="900.1" y="490" font-size="12" fill="#999" text-anchor="middle">10 y</text><line x1="250" y1="470" x2="990" y2="470" stroke="#333" stroke-width="1.2"/><text x="236" y="126" font-size="13.5" fill="#333" text-anchor="end">金融市场反应</text><rect x="260.4" y="110" width="107.6" height="22" rx="4" fill="#c94f4f" opacity="0.8"/><text x="236" y="171" font-size="13.5" fill="#333" text-anchor="end">央行流动性操作</text><rect x="400.5" y="155" width="51.4" height="22" rx="4" fill="#d97a3d" opacity="0.8"/><text x="236" y="216" font-size="13.5" fill="#333" text-anchor="end">政治协调（内阁／央行）</text><rect x="516.6" y="200" width="107.6" height="22" rx="4" fill="#b8862f" opacity="0.8"/><text x="236" y="261" font-size="13.5" fill="#333" text-anchor="end">国际谈判（G20／IMF）</text><rect x="568.0" y="245" width="104.4" height="22" rx="4" fill="#009E73" opacity="0.8"/><text x="236" y="306" font-size="13.5" fill="#333" text-anchor="end">社会反馈（就业／舆论）</text><rect x="607.6" y="290" width="68.0" height="22" rx="4" fill="#3a6ea5" opacity="0.8"/><text x="236" y="351" font-size="13.5" fill="#333" text-anchor="end">财政政策执行</text><rect x="675.6" y="335" width="51.4" height="22" rx="4" fill="#6a4c93" opacity="0.8"/><text x="236" y="396" font-size="13.5" fill="#333" text-anchor="end">社会心理恢复</text><rect x="675.6" y="380" width="83.8" height="22" rx="4" fill="#8a6fbf" opacity="0.8"/><text x="236" y="441" font-size="13.5" fill="#333" text-anchor="end">生态系统恢复</text><rect x="867.7" y="425" width="107.6" height="22" rx="4" fill="#5b7f6a" opacity="0.8"/><line x1="516.6" y1="96" x2="516.6" y2="470" stroke="#c94f4f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="522.6" y="112" font-size="12.5" fill="#c94f4f">“临界日”——市场已在数小时内定价</text><text x="250" y="530" font-size="12" fill="#999">注：区间为典型量级（示意，质量 C）。真正的脆弱性来自“快系统”与“慢系统”之间的错位，而非任一系统的绝对速度。</text></svg>

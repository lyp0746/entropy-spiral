<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520" font-family="'Microsoft YaHei','SimHei',Arial,sans-serif">
<rect width="1060" height="520" fill="#ffffff"/>
<text x="530" y="44" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">制度类型 × 时间尺度：优越性是相对的</text><text x="530" y="68" font-size="13.5" fill="#666" text-anchor="middle">同一制度在不同时间尺度上优劣相反；不存在能同时优化所有尺度的制度</text><text x="284.0" y="108" font-size="13" fill="#333" text-anchor="middle">分钟级</text><text x="412.0" y="108" font-size="13" fill="#333" text-anchor="middle">小时级</text><text x="540.0" y="108" font-size="13" fill="#333" text-anchor="middle">天级</text><text x="668.0" y="108" font-size="13" fill="#333" text-anchor="middle">周级</text><text x="796.0" y="108" font-size="13" fill="#333" text-anchor="middle">年级</text><text x="924.0" y="108" font-size="13" fill="#333" text-anchor="middle">十年级</text><text x="206" y="163.0" font-size="14" fill="#333" text-anchor="end">专制中央集权</text><rect x="220" y="120" width="122" height="72" rx="5" fill="#1f7a5c"/><text x="281.0" y="160.0" font-size="13" fill="#fff" text-anchor="middle">强</text><rect x="348" y="120" width="122" height="72" rx="5" fill="#1f7a5c"/><text x="409.0" y="160.0" font-size="13" fill="#fff" text-anchor="middle">强</text><rect x="476" y="120" width="122" height="72" rx="5" fill="#8fc7ad"/><text x="537.0" y="160.0" font-size="13" fill="#333" text-anchor="middle">中</text><rect x="604" y="120" width="122" height="72" rx="5" fill="#eceff3"/><text x="665.0" y="160.0" font-size="13" fill="#333" text-anchor="middle">弱</text><rect x="732" y="120" width="122" height="72" rx="5" fill="#d98a8a"/><text x="793.0" y="160.0" font-size="13" fill="#333" text-anchor="middle">差</text><rect x="860" y="120" width="122" height="72" rx="5" fill="#d98a8a"/><text x="921.0" y="160.0" font-size="13" fill="#333" text-anchor="middle">差</text><text x="206" y="241.0" font-size="14" fill="#333" text-anchor="end">民主自由制</text><rect x="220" y="198" width="122" height="72" rx="5" fill="#d98a8a"/><text x="281.0" y="238.0" font-size="13" fill="#333" text-anchor="middle">差</text><rect x="348" y="198" width="122" height="72" rx="5" fill="#eceff3"/><text x="409.0" y="238.0" font-size="13" fill="#333" text-anchor="middle">弱</text><rect x="476" y="198" width="122" height="72" rx="5" fill="#eceff3"/><text x="537.0" y="238.0" font-size="13" fill="#333" text-anchor="middle">弱</text><rect x="604" y="198" width="122" height="72" rx="5" fill="#8fc7ad"/><text x="665.0" y="238.0" font-size="13" fill="#333" text-anchor="middle">中</text><rect x="732" y="198" width="122" height="72" rx="5" fill="#1f7a5c"/><text x="793.0" y="238.0" font-size="13" fill="#fff" text-anchor="middle">强</text><rect x="860" y="198" width="122" height="72" rx="5" fill="#1f7a5c"/><text x="921.0" y="238.0" font-size="13" fill="#fff" text-anchor="middle">强</text><text x="206" y="319.0" font-size="14" fill="#333" text-anchor="end">混合型</text><rect x="220" y="276" width="122" height="72" rx="5" fill="#eceff3"/><text x="281.0" y="316.0" font-size="13" fill="#333" text-anchor="middle">弱</text><rect x="348" y="276" width="122" height="72" rx="5" fill="#eceff3"/><text x="409.0" y="316.0" font-size="13" fill="#333" text-anchor="middle">弱</text><rect x="476" y="276" width="122" height="72" rx="5" fill="#8fc7ad"/><text x="537.0" y="316.0" font-size="13" fill="#333" text-anchor="middle">中</text><rect x="604" y="276" width="122" height="72" rx="5" fill="#8fc7ad"/><text x="665.0" y="316.0" font-size="13" fill="#333" text-anchor="middle">中</text><rect x="732" y="276" width="122" height="72" rx="5" fill="#8fc7ad"/><text x="793.0" y="316.0" font-size="13" fill="#333" text-anchor="middle">中</text><rect x="860" y="276" width="122" height="72" rx="5" fill="#eceff3"/><text x="921.0" y="316.0" font-size="13" fill="#333" text-anchor="middle">弱</text><text x="220" y="394" font-size="12" fill="#999">注：为方向性判断（质量 C）。它同时解释了为什么“制度孰优”的争论在时间尺度不明确时永远无解。</text></svg>

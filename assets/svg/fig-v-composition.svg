<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="42" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">脆弱性 V 的构成与权重</text><text x="500" y="66" font-size="14" fill="#666" text-anchor="middle">V = α·Θ + β·I + γ·κ + λ·(Θ×κ)；权重 γ &gt; α &gt; λ &gt; β ≈ 0</text><rect x="80.0" y="170" width="360.0" height="90" rx="10" fill="#c94f4f" opacity="0.85"/><text x="260.0" y="210" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">γ·κ</text><text x="260.0" y="236" font-size="13.5" fill="#fff" text-anchor="middle" opacity="0.9">耦合（主导）</text><text x="260.0" y="285" font-size="13" fill="#888" text-anchor="middle">0.45</text><rect x="440.0" y="170" width="240.0" height="90" rx="10" fill="#3a6ea5" opacity="0.85"/><text x="560.0" y="210" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">α·Θ</text><text x="560.0" y="236" font-size="13.5" fill="#fff" text-anchor="middle" opacity="0.9">租佃</text><text x="560.0" y="285" font-size="13" fill="#888" text-anchor="middle">0.30</text><rect x="680.0" y="170" width="160.0" height="90" rx="10" fill="#b8862f" opacity="0.85"/><text x="760.0" y="210" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">λ·Θκ</text><text x="760.0" y="236" font-size="13.5" fill="#fff" text-anchor="middle" opacity="0.9">交互</text><text x="760.0" y="285" font-size="13" fill="#888" text-anchor="middle">0.20</text><rect x="840.0" y="170" width="40.0" height="90" rx="10" fill="#9db8e0" opacity="0.85"/><text x="860.0" y="150" font-size="14" fill="#9db8e0" text-anchor="middle">β·I</text><text x="860.0" y="285" font-size="13" fill="#888" text-anchor="middle">0.05</text><line x1="480" y1="300" x2="480" y2="352" stroke="#333" stroke-width="2.4" marker-end="url(#vc)"/><circle cx="480" cy="392" r="40" fill="#1a1a1a"/><text x="480" y="400" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">V</text><line x1="524" y1="392" x2="600" y2="392" stroke="#333" stroke-width="2.4" marker-end="url(#vc)"/><text x="562" y="380" font-size="13" fill="#666">×[1+0.5(1−ι)]</text><circle cx="650" cy="392" r="46" fill="none" stroke="#c94f4f" stroke-width="3"/><text x="650" y="400" font-size="20" font-weight="700" fill="#c94f4f" text-anchor="middle">V<tspan font-size="13">ι</tspan></text><text x="720" y="386" font-size="14" fill="#555">ι 越低，放大越强</text><text x="720" y="410" font-size="13" fill="#999">ι=1 → ×1.0；ι=0 → ×1.5</text><defs><marker id="vc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#333"/></marker></defs></svg>

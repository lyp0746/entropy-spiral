<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="1000" height="620" fill="#ffffff"/>
<text x="500" y="40" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">债务永续化的分国对照：利息—增长差与政治一致性</text><text x="500" y="66" font-size="14.5" fill="#666" text-anchor="middle">气泡面积 ∝ 政府债务/GDP；右上 = 高利息差 + 低一致性，脆弱性最高</text><rect x="454.0" y="90.0" width="486.0" height="215.0" fill="#fdf6f4"/><rect x="454.0" y="305.0" width="486.0" height="215.0" fill="#fdf0ee"/><line x1="454.0" y1="90" x2="454.0" y2="520" stroke="#999" stroke-dasharray="6 5"/><line x1="130" y1="305.0" x2="940" y2="305.0" stroke="#999" stroke-dasharray="6 5"/><line x1="130" y1="520" x2="940" y2="520" stroke="#333" stroke-width="1.3"/><line x1="130" y1="80" x2="130" y2="520" stroke="#333" stroke-width="1.3"/><text x="130.0" y="544" font-size="14" fill="#555" text-anchor="middle">-1.0</text><text x="292.0" y="544" font-size="14" fill="#555" text-anchor="middle">-0.5</text><text x="454.0" y="544" font-size="14" fill="#555" text-anchor="middle">+0.0</text><text x="616.0" y="544" font-size="14" fill="#555" text-anchor="middle">+0.5</text><text x="778.0" y="544" font-size="14" fill="#555" text-anchor="middle">+1.0</text><text x="940.0" y="544" font-size="14" fill="#555" text-anchor="middle">+1.5</text><text x="120" y="525.0" font-size="14" fill="#555" text-anchor="end">0.5</text><text x="120" y="417.5" font-size="14" fill="#555" text-anchor="end">0.6</text><text x="120" y="310.0" font-size="14" fill="#555" text-anchor="end">0.7</text><text x="120" y="202.5" font-size="14" fill="#555" text-anchor="end">0.8</text><text x="120" y="95.0" font-size="14" fill="#555" text-anchor="end">0.9</text><text x="535" y="602" font-size="16" fill="#333" text-anchor="middle">利息—增长差 r − g（百分点）</text><text x="30" y="305" font-size="16" fill="#333" transform="rotate(-90 30 305)" text-anchor="middle">政治一致性 ι</text><text x="470.2" y="106.1" font-size="14" fill="#2f7a4f">r&lt;g：债务被增长/低利率吸收</text><text x="470.2" y="493.1" font-size="14" fill="#a04848">r&gt;g 且一致性低：脆弱性上升</text><circle cx="292.0" cy="197.5" r="35.0" fill="#009E73" fill-opacity="0.30" stroke="#009E73" stroke-width="2"/><text x="292.0" y="202.5" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">日本</text><text x="292.0" y="250.5" font-size="12.5" fill="#666" text-anchor="middle">债务 250%</text><circle cx="616.0" cy="412.5" r="21.7" fill="#c94f4f" fill-opacity="0.30" stroke="#c94f4f" stroke-width="2"/><text x="616.0" y="417.5" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">美国</text><text x="616.0" y="452.2" font-size="12.5" fill="#666" text-anchor="middle">债务 122%</text><circle cx="551.2" cy="358.8" r="18.4" fill="#3a6ea5" fill-opacity="0.30" stroke="#3a6ea5" stroke-width="2"/><text x="551.2" y="363.8" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">欧元区</text><text x="551.2" y="395.1" font-size="12.5" fill="#666" text-anchor="middle">债务 90%</text><circle cx="713.2" cy="305.0" r="21.5" fill="#b8862f" fill-opacity="0.30" stroke="#b8862f" stroke-width="2"/><text x="713.2" y="310.0" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">中国</text><text x="713.2" y="344.5" font-size="12.5" fill="#666" text-anchor="middle">债务 120%</text><circle cx="648.4" cy="326.5" r="19.4" fill="#8a5fa8" fill-opacity="0.30" stroke="#8a5fa8" stroke-width="2"/><text x="648.4" y="331.5" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">英国</text><text x="648.4" y="363.9" font-size="12.5" fill="#666" text-anchor="middle">债务 100%</text><text x="940" y="504" font-size="12.5" fill="#888" text-anchor="end">指示性数据（质量 C），仅示结构，数值不可引用</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="40" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">脆弱性诊断五步模板</text><text x="500" y="66" font-size="14.5" fill="#666" text-anchor="middle">每一步都必须能被独立检验；不可检验的步退回重做</text><rect x="30" y="140" width="168" height="150" rx="10" fill="#fafafa" stroke="#3a6ea5" stroke-width="1.8"/><rect x="30" y="140" width="168" height="40" rx="10" fill="#3a6ea5" opacity="0.14"/><text x="114.0" y="167" font-size="15.5" font-weight="700" fill="#3a6ea5" text-anchor="middle">1. 界定系统与边界</text><text x="114.0" y="212" font-size="14" fill="#333" text-anchor="middle">地理范围·承载流量</text><text x="114.0" y="236" font-size="14" fill="#333" text-anchor="middle">替代路径</text><line x1="201" y1="215" x2="217" y2="215" stroke="#333" stroke-width="2.2" marker-end="url(#dt)"/><rect x="220" y="140" width="168" height="150" rx="10" fill="#fafafa" stroke="#b8862f" stroke-width="1.8"/><rect x="220" y="140" width="168" height="40" rx="10" fill="#b8862f" opacity="0.14"/><text x="304.0" y="167" font-size="15.5" font-weight="700" fill="#b8862f" text-anchor="middle">2. 四维赋值并标等级</text><text x="304.0" y="212" font-size="14" fill="#333" text-anchor="middle">Θ I κ ι</text><text x="304.0" y="236" font-size="14" fill="#333" text-anchor="middle">逐项标 A/B/C</text><line x1="391" y1="215" x2="407" y2="215" stroke="#333" stroke-width="2.2" marker-end="url(#dt)"/><rect x="410" y="140" width="168" height="150" rx="10" fill="#fafafa" stroke="#c94f4f" stroke-width="1.8"/><rect x="410" y="140" width="168" height="40" rx="10" fill="#c94f4f" opacity="0.14"/><text x="494.0" y="167" font-size="15.5" font-weight="700" fill="#c94f4f" text-anchor="middle">3. 计算 V 与敏感性</text><text x="494.0" y="212" font-size="14" fill="#333" text-anchor="middle">式(7.1)(7.2)</text><text x="494.0" y="236" font-size="14" fill="#333" text-anchor="middle">扰动 γ、β</text><line x1="581" y1="215" x2="597" y2="215" stroke="#333" stroke-width="2.2" marker-end="url(#dt)"/><rect x="600" y="140" width="168" height="150" rx="10" fill="#fafafa" stroke="#009E73" stroke-width="1.8"/><rect x="600" y="140" width="168" height="40" rx="10" fill="#009E73" opacity="0.14"/><text x="684.0" y="167" font-size="15.5" font-weight="700" fill="#009E73" text-anchor="middle">4. 情景与监测信号</text><text x="684.0" y="212" font-size="14" fill="#333" text-anchor="middle">3—5 个 if–then</text><text x="684.0" y="236" font-size="14" fill="#333" text-anchor="middle">指标组合阈值</text><line x1="771" y1="215" x2="787" y2="215" stroke="#333" stroke-width="2.2" marker-end="url(#dt)"/><rect x="790" y="140" width="168" height="150" rx="10" fill="#fafafa" stroke="#8a5fa8" stroke-width="1.8"/><rect x="790" y="140" width="168" height="40" rx="10" fill="#8a5fa8" opacity="0.14"/><text x="874.0" y="167" font-size="15.5" font-weight="700" fill="#8a5fa8" text-anchor="middle">5. 登记与复检</text><text x="874.0" y="212" font-size="14" fill="#333" text-anchor="middle">时间戳条目</text><text x="874.0" y="236" font-size="14" fill="#333" text-anchor="middle">到期核对</text><rect x="600" y="310" width="168" height="44" rx="8" fill="#fff6ee" stroke="#D55E00"/><text x="684.0" y="338" font-size="13.5" font-weight="700" fill="#A83A00" text-anchor="middle">阈值必须在看信号前登记</text><path d="M950,360 C 985,360 985,480 500,480 C 15,480 15,360 50,360" stroke="#b8862f" stroke-width="2.2" fill="none" stroke-dasharray="8 6" marker-end="url(#dt2)"/><text x="500" y="505" font-size="14.5" fill="#8a6520" text-anchor="middle">系统性偏离全部情景 ⇒ 修改框架（不是修改预测）</text><defs><marker id="dt" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#333"/></marker><marker id="dt2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b8862f"/></marker></defs></svg>

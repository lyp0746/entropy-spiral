<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="1000" height="580" fill="#ffffff"/>
<text x="500" y="42" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">传播快、纠错慢：五类反馈通道</text><text x="500" y="66" font-size="14" fill="#666" text-anchor="middle">横轴为信号速度（对数示意），纵轴为纠错轮次（定性）</text><rect x="450" y="322" width="310" height="148" fill="#c94f4f" opacity="0.07"/><rect x="450" y="322" width="310" height="148" fill="none" stroke="#c94f4f" stroke-width="1.2" stroke-dasharray="6 5"/><text x="754" y="452" font-size="13" fill="#c94f4f" text-anchor="end">失配区：冲击已到、纠正未完成</text><line x1="140" y1="470" x2="760" y2="470" stroke="#333" stroke-width="1.4"/><line x1="140" y1="470" x2="140" y2="100" stroke="#333" stroke-width="1.4"/><text x="450" y="512" font-size="14" fill="#555" text-anchor="middle">信号速度 →（快）</text><text x="126" y="285" font-size="14" fill="#555" transform="rotate(-90 126 285)" text-anchor="middle">纠错轮次 →（多）</text><circle cx="189.6" cy="396.0" r="9" fill="#b8862f" opacity="0.9"/><text x="189.6" y="378.0" font-size="16" font-weight="700" fill="#b8862f" text-anchor="middle">政治</text><text x="189.6" y="422.0" font-size="12" fill="#888" text-anchor="middle">选票·立法</text><circle cx="326.0" cy="377.5" r="9" fill="#3a6ea5" opacity="0.9"/><text x="326.0" y="359.5" font-size="16" font-weight="700" fill="#3a6ea5" text-anchor="middle">商品</text><text x="326.0" y="403.5" font-size="12" fill="#888" text-anchor="middle">运价·库存</text><circle cx="481.0" cy="266.5" r="9" fill="#666" opacity="0.9"/><text x="481.0" y="248.5" font-size="16" font-weight="700" fill="#666" text-anchor="middle">技术</text><text x="481.0" y="292.5" font-size="12" fill="#888" text-anchor="middle">CVE·补丁</text><circle cx="623.6" cy="303.5" r="9" fill="#c94f4f" opacity="0.9"/><text x="623.6" y="285.5" font-size="16" font-weight="700" fill="#c94f4f" text-anchor="middle">金融</text><text x="623.6" y="329.5" font-size="12" fill="#888" text-anchor="middle">利率·利差</text><circle cx="741.4" cy="155.5" r="9" fill="#009E73" opacity="0.9"/><text x="741.4" y="137.5" font-size="16" font-weight="700" fill="#009E73" text-anchor="middle">信息</text><text x="741.4" y="181.5" font-size="12" fill="#888" text-anchor="middle">数据·转发</text><text x="140" y="540" font-size="13" fill="#555">传播速度由最快通道决定；纠错速度由最慢通道决定。二者之差即系统在失稳区暴露的时长。</text><text x="140" y="562" font-size="12" fill="#999">示意性（质量 C），非实测刻度；点位表示通道间的相对位置。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Microsoft YaHei','Arial',sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">知识生成与知识认可的时间层级</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#666">同一事件在五个层级上的“完成时间”相差数个数量级</text>

  <!-- axes -->
  <line x1="120" y1="90" x2="120" y2="360" stroke="#333" stroke-width="1.4"/>
  <line x1="120" y1="360" x2="700" y2="360" stroke="#333" stroke-width="1.4"/>
  <text x="70" y="225" font-size="12" fill="#333" transform="rotate(-90 70 225)" text-anchor="middle">层级（由快到慢）</text>
  <text x="410" y="392" font-size="12" fill="#333" text-anchor="middle">典型完成时间（对数尺度）</text>

  <!-- bars: widths increase because slower -->
  <g font-size="13">
    <rect x="120" y="100" width="90"  height="34" fill="#2e6fb7"/>
    <text x="222" y="122" fill="#1a1a1a">生成（天级）</text>

    <rect x="120" y="150" width="160" height="34" fill="#3f8fd0"/>
    <text x="292" y="172" fill="#1a1a1a">传播（小时级）</text>

    <rect x="120" y="200" width="290" height="34" fill="#e0a72e"/>
    <text x="422" y="222" fill="#1a1a1a">验证（周级）</text>

    <rect x="120" y="250" width="430" height="34" fill="#d06a2e"/>
    <text x="562" y="272" fill="#1a1a1a">同行评审（月级）</text>

    <rect x="120" y="300" width="560" height="34" fill="#b03030"/>
    <text x="560" y="322" fill="#ffffff">制度认可（年级）</text>
  </g>

  <!-- critical moment -->
  <line x1="120" y1="88" x2="120" y2="360" stroke="#c0392b" stroke-width="0" />
  <line x1="120" y1="340" x2="680" y2="340" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="684" y="344" font-size="11" fill="#c0392b">公众讨论开始</text>
  <text x="684" y="330" font-size="11" fill="#c0392b">验证尚未开始</text>
</svg>

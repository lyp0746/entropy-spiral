<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="1000" height="660" fill="#ffffff"/>
<text x="500" y="40" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">加速的形式与脆弱性的诊断叉积</text><text x="500" y="66" font-size="14.5" fill="#666" text-anchor="middle">行 = V 的趋势，列 = κ 的结构变化；单元格为典型形态。这是诊断参考，不是因果矩阵。</text><text x="315.0" y="114" font-size="15" font-weight="700" fill="#333" text-anchor="middle">κ 上升（耦合加深）</text><text x="565.0" y="114" font-size="15" font-weight="700" fill="#333" text-anchor="middle">κ 不变（结构锁定）</text><text x="815.0" y="114" font-size="15" font-weight="700" fill="#333" text-anchor="middle">κ 下降（去耦合）</text><text x="172" y="208.0" font-size="16" font-weight="700" fill="#333" text-anchor="end">V 上升</text><rect x="196" y="136" width="238" height="144" rx="10" fill="#c94f4f" opacity="0.10"/><rect x="196" y="136" width="238" height="144" rx="10" fill="none" stroke="#c94f4f" stroke-width="1.4" opacity="0.75"/><text x="315.0" y="188" font-size="16.5" font-weight="700" fill="#c94f4f" text-anchor="middle">典型红皇后</text><text x="315.0" y="216" font-size="13" fill="#444" text-anchor="middle">AI 算力竞赛、军备竞赛</text><rect x="446" y="136" width="238" height="144" rx="10" fill="#c98a4f" opacity="0.10"/><rect x="446" y="136" width="238" height="144" rx="10" fill="none" stroke="#c98a4f" stroke-width="1.4" opacity="0.75"/><text x="565.0" y="188" font-size="16.5" font-weight="700" fill="#c98a4f" text-anchor="middle">度量反演</text><text x="565.0" y="216" font-size="13" fill="#444" text-anchor="middle">投入加速但依赖不减（民国）</text><rect x="696" y="136" width="238" height="144" rx="10" fill="#b8862f" opacity="0.10"/><rect x="696" y="136" width="238" height="144" rx="10" fill="none" stroke="#b8862f" stroke-width="1.4" opacity="0.75"/><text x="815.0" y="188" font-size="16.5" font-weight="700" fill="#b8862f" text-anchor="middle">脱钩阵痛期</text><text x="815.0" y="216" font-size="13" fill="#444" text-anchor="middle">快速去耦合的转型成本</text><text x="172" y="364.0" font-size="16" font-weight="700" fill="#333" text-anchor="end">V 平稳</text><rect x="196" y="292" width="238" height="144" rx="10" fill="#3a6ea5" opacity="0.10"/><rect x="196" y="292" width="238" height="144" rx="10" fill="none" stroke="#3a6ea5" stroke-width="1.4" opacity="0.75"/><text x="315.0" y="344" font-size="16.5" font-weight="700" fill="#3a6ea5" text-anchor="middle">稳态耦合</text><text x="315.0" y="372" font-size="13" fill="#444" text-anchor="middle">贸易稳定期，风险被制度吸收</text><rect x="446" y="292" width="238" height="144" rx="10" fill="#6b8fbf" opacity="0.10"/><rect x="446" y="292" width="238" height="144" rx="10" fill="none" stroke="#6b8fbf" stroke-width="1.4" opacity="0.75"/><text x="565.0" y="344" font-size="16.5" font-weight="700" fill="#6b8fbf" text-anchor="middle">锁定均衡</text><text x="565.0" y="372" font-size="13" fill="#444" text-anchor="middle">气候适应（分化路径）</text><rect x="696" y="292" width="238" height="144" rx="10" fill="#009E73" opacity="0.10"/><rect x="696" y="292" width="238" height="144" rx="10" fill="none" stroke="#009E73" stroke-width="1.4" opacity="0.75"/><text x="815.0" y="344" font-size="16.5" font-weight="700" fill="#009E73" text-anchor="middle">有序收缩</text><text x="815.0" y="372" font-size="13" fill="#444" text-anchor="middle">主动去耦合，缓冲充足</text><text x="172" y="520.0" font-size="16" font-weight="700" fill="#333" text-anchor="end">V 下降</text><rect x="196" y="448" width="238" height="144" rx="10" fill="#9a5fb0" opacity="0.10"/><rect x="196" y="448" width="238" height="144" rx="10" fill="none" stroke="#9a5fb0" stroke-width="1.4" opacity="0.75"/><text x="315.0" y="500" font-size="16.5" font-weight="700" fill="#9a5fb0" text-anchor="middle">结构性矛盾</text><text x="315.0" y="528" font-size="13" fill="#444" text-anchor="middle">少见：需 ι 大幅改善抵销 κ</text><rect x="446" y="448" width="238" height="144" rx="10" fill="#009E73" opacity="0.10"/><rect x="446" y="448" width="238" height="144" rx="10" fill="none" stroke="#009E73" stroke-width="1.4" opacity="0.75"/><text x="565.0" y="500" font-size="16.5" font-weight="700" fill="#009E73" text-anchor="middle">自我修复</text><text x="565.0" y="528" font-size="13" fill="#444" text-anchor="middle">衰退后的去杠杆与重置</text><rect x="696" y="448" width="238" height="144" rx="10" fill="#7a8a9a" opacity="0.10"/><rect x="696" y="448" width="238" height="144" rx="10" fill="none" stroke="#7a8a9a" stroke-width="1.4" opacity="0.75"/><text x="815.0" y="500" font-size="16.5" font-weight="700" fill="#7a8a9a" text-anchor="middle">孤立失效</text><text x="815.0" y="528" font-size="13" fill="#444" text-anchor="middle">封闭系统失去外部缓冲</text><rect x="196" y="136" width="238" height="144" rx="10" fill="none" stroke="#c94f4f" stroke-width="3"/><text x="422" y="164" font-size="12.5" font-weight="700" fill="#c94f4f" text-anchor="end">红皇后成立</text><text x="458" y="164" font-size="12.5" font-weight="700" fill="#c98a4f" text-anchor="start">度量反演</text><text x="190" y="632" font-size="13" fill="#777">注：κ 上升不必然推高 V；当 ι 能快速调整或去耦合有序时，V 可平稳甚至下降。</text></svg>

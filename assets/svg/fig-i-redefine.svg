<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" font-family="'Microsoft YaHei','SimHei',Arial,sans-serif">
<rect width="1060" height="560" fill="#ffffff"/>
<text x="530" y="44" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">I 的三次操作化尝试与它的真实身份</text><text x="530" y="68" font-size="13.5" fill="#666" text-anchor="middle">复杂度、信息处理、政治意愿都无法量化 I；它实际测度的是“政治制度下达成协调的最小时间”</text><rect x="60" y="96" width="280" height="150" rx="10" fill="#3a6ea5" opacity="0.06" stroke="#3a6ea5" stroke-opacity="0.4"/><text x="76" y="124" font-size="12" font-weight="700" fill="#3a6ea5" letter-spacing="2">尝试一</text><text x="76" y="152" font-size="16" font-weight="700" fill="#1a1a1a">I = 组织复杂度</text><text x="76" y="180" font-size="12.5" fill="#555">量度：层级数、机构数、协调节点数</text><text x="76" y="206" font-size="12.5" fill="#c94f4f">失败：复杂组织反而更慢；简单组织也</text><text x="76" y="226" font-size="12.5" fill="#c94f4f">可能脆弱</text><path d="M348,171.0 l22,0 m-8,-7 l8,7 l-8,7" fill="none" stroke="#bbb" stroke-width="2"/><rect x="390" y="96" width="280" height="150" rx="10" fill="#b8862f" opacity="0.06" stroke="#b8862f" stroke-opacity="0.4"/><text x="406" y="124" font-size="12" font-weight="700" fill="#b8862f" letter-spacing="2">尝试二</text><text x="406" y="152" font-size="16" font-weight="700" fill="#1a1a1a">I = 信息处理能力</text><text x="406" y="180" font-size="12.5" fill="#555">量度：带宽、算力、数据存量</text><text x="406" y="206" font-size="12.5" fill="#c94f4f">失败：2008 年信息充足，协调仍</text><text x="406" y="226" font-size="12.5" fill="#c94f4f">然失败</text><path d="M678,171.0 l22,0 m-8,-7 l8,7 l-8,7" fill="none" stroke="#bbb" stroke-width="2"/><rect x="720" y="96" width="280" height="150" rx="10" fill="#009E73" opacity="0.06" stroke="#009E73" stroke-opacity="0.4"/><text x="736" y="124" font-size="12" font-weight="700" fill="#009E73" letter-spacing="2">尝试三</text><text x="736" y="152" font-size="16" font-weight="700" fill="#1a1a1a">I = 政治意愿</text><text x="736" y="180" font-size="12.5" fill="#555">量度：承诺指数、信用评级、政治稳定</text><text x="736" y="206" font-size="12.5" fill="#c94f4f">失败：有意愿仍需时间，程序不可压缩</text><text x="736" y="226" font-size="12.5" fill="#c94f4f"></text><path d="M530,262 L530,296" stroke="#888" stroke-width="2" marker-end=""/><path d="M522,288 l8,10 l8,-10" fill="#888"/><rect x="200" y="300" width="660" height="150" rx="12" fill="#6a4c93" opacity="0.08" stroke="#6a4c93" stroke-opacity="0.5"/><text x="530" y="336" font-size="15" font-weight="700" fill="#6a4c93" text-anchor="middle">I 的真实身份</text><text x="530" y="374" font-size="20" font-weight="800" fill="#1a1a1a" text-anchor="middle">在给定政治制度下，达成必要协调的最小时间</text><text x="530" y="410" font-size="13.5" fill="#555" text-anchor="middle">I = T_political(制度结构, 参与者数, 利益冲突强度)　——　政治变量，不是组织变量</text><text x="530" y="438" font-size="12.5" fill="#888" text-anchor="middle">它的“不可测”不是数据缺失，而是制度时间与市场时间的矛盾本身</text></svg>

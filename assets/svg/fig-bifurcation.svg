<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#333"/></marker><marker id="au" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b8862f"/></marker></defs><text x="500" y="42" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle">精英二分：同一精英池的两条配置路径</text><rect x="360" y="70" width="280" height="62" rx="10" fill="#eef3fb" stroke="#7fa0cc"/><text x="500" y="108" font-size="19" font-weight="700" fill="#1b3a63" text-anchor="middle">精英池（受技术与制度约束）</text><line x1="500" y1="132" x2="500" y2="176" stroke="#333" stroke-width="2.4" marker-end="url(#ar)"/><rect x="330" y="176" width="340" height="52" rx="8" fill="#fbf7ee" stroke="#c9a06a"/><text x="500" y="198" font-size="16.5" fill="#6b3d12" text-anchor="middle">相对收益比较：位置租 r ／ 生产回报 π</text><text x="500" y="218" font-size="14.5" fill="#8a6520" text-anchor="middle">Θ↑（租佃份额上升）⇒ r/π ↑ ⇒ 分流右移</text><path d="M500,228 L500,252 L235,252 L235,286" stroke="#333" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M500,228 L500,252 L765,252 L765,286" stroke="#333" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="80" y="286" width="310" height="150" rx="10" fill="#f3f9f5" stroke="#009E73"/><text x="235" y="316" font-size="18" font-weight="700" fill="#24502b" text-anchor="middle">生产性精英</text><text x="235" y="344" font-size="15.5" fill="#3a4a60" text-anchor="middle">创新、组织生产、承担风险</text><text x="235" y="370" font-size="15.5" fill="#3a4a60" text-anchor="middle">评价权来自可复现的产出</text><text x="235" y="396" font-size="15.5" fill="#3a4a60" text-anchor="middle">产出扩大 ⇒ 税基扩大</text><text x="235" y="424" font-size="16" font-weight="700" fill="#009E73" text-anchor="middle">系统韧性 ↑</text><rect x="610" y="286" width="310" height="150" rx="10" fill="#fdf2f0" stroke="#c94f4f"/><text x="765" y="316" font-size="18" font-weight="700" fill="#7a2626" text-anchor="middle">寄生性精英（租金型）</text><text x="765" y="344" font-size="15.5" fill="#5a3a3a" text-anchor="middle">争夺位置租、俘获评价权 Φ</text><text x="765" y="370" font-size="15.5" fill="#5a3a3a" text-anchor="middle">评价权由自我授权/流量决定</text><text x="765" y="396" font-size="15.5" fill="#5a3a3a" text-anchor="middle">再分配挤压 ⇒ 生产被挤出</text><text x="765" y="424" font-size="16" font-weight="700" fill="#c94f4f" text-anchor="middle">系统脆弱性 ↑</text><path d="M235,436 L235,486 L500,486 L500,510" stroke="#333" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M765,436 L765,486 L500,486" stroke="#333" stroke-width="2.2" fill="none"/><rect x="330" y="510" width="340" height="52" rx="8" fill="#fff6ee" stroke="#D55E00"/><text x="500" y="542" font-size="16.5" font-weight="700" fill="#A83A00" text-anchor="middle">压力释放失效 ⇒ 积累张力 ⇒ 阈值重置</text><path d="M920,405 C 985,405 985,105 648,105" stroke="#b8862f" stroke-width="2.2" fill="none" stroke-dasharray="8 6" marker-end="url(#au)"/><text x="806" y="88" font-size="14.5" fill="#8a6520" text-anchor="middle">重置只清状态，不改结构</text></svg>
